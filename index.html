<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMP Smart Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #121212; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
        .btn-primary { background: #f59e0b; color: #000; font-weight: bold; transition: all 0.2s; }
        .btn-primary:hover { background: #d97706; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- MAIN APP HEADER -->
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
            <img src="https://rmpinteriorwork-bot.github.io/rmp-EST/RMP-LOGO.jpeg" alt="Logo" class="h-16 w-16 object-contain bg-white rounded p-1" onerror="this.style.display='none'">
            <div>
                <h1 class="text-3xl font-bold text-yellow-500">RMP Smart Estimator</h1>
                <p class="text-sm text-gray-400">Built with Vision. Designed with Care.</p>
            </div>
        </div>
        <button onclick="handleAdminLogin()" class="glass-panel px-4 py-2 hover:bg-gray-800 flex items-center gap-2">
            ⚙️ Admin
        </button>
    </div>

    <!-- MAIN ESTIMATOR UI -->
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-6">
            <div class="glass-panel p-6">
                <h2 class="text-xl font-bold mb-4 text-yellow-500">ADD TO ESTIMATE</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-400 mb-1">SELECT ITEM</label>
                        <select id="itemSelect" onchange="updateHelperText()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white">
                            <option value="">-- Select --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">QUANTITY (<span id="qtyLabel">QTY</span>)</label>
                        <input type="number" id="itemQty" oninput="updateHelperText()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white" placeholder="0">
                    </div>
                </div>
                <div id="helperText" class="mt-2 text-sm text-yellow-400 h-5"></div>
                <button onclick="addToEstimate()" class="mt-4 w-full btn-primary py-2 rounded">
                    + Add to Estimate
                </button>
            </div>
        </div>

        <div class="glass-panel p-6 flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-yellow-500">ESTIMATE BREAKUP</h2>
            <div id="estimateList" class="flex-1 space-y-3 mb-4 overflow-y-auto max-h-96"></div>
            <div class="border-t border-gray-700 pt-4">
                <div class="flex justify-between text-2xl font-bold text-yellow-500">
                    <span>GRAND TOTAL</span>
                    <span id="grandTotal">₹0</span>
                </div>
                <button onclick="openPreview()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition-all">
                    🔍 Preview & Download
                </button>
            </div>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-95 hidden z-50 flex-col items-center p-4 overflow-y-auto">
        <div class="w-full max-w-4xl flex justify-between items-center mb-4 sticky top-0 z-50 bg-gray-800 p-4 rounded-lg shadow-xl border border-gray-600">
            <h2 class="text-yellow-500 font-bold text-lg">🔍 Preview Estimate</h2>
            <div class="flex gap-4">
                <button onclick="closePreview()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded font-bold">✏️ Edit</button>
                <button id="realDownloadBtn" onclick="downloadPDF()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded font-bold">📥 Download</button>
            </div>
        </div>

        <div id="pdfContent" class="bg-white p-10 w-full max-w-4xl shadow-2xl relative" style="color: black; font-family: sans-serif;">
            <div style="border-bottom: 3px solid #f59e0b; padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <img src="https://rmpinteriorwork-bot.github.io/rmp-EST/RMP-LOGO.jpeg" alt="Logo" style="height: 65px; width: 65px; object-fit: contain;">
                    <div>
                        <h1 style="font-size: 32px; font-weight: 900; color: #000; margin: 0; text-transform: uppercase;">RMP INTERIOR</h1>
                        <p style="font-size: 14px; color: #000; margin: 4px 0; font-weight: bold; letter-spacing: 1px;">Built with Vision. Designed with Care.</p>
                        <p style="font-size: 13px; color: #000; margin: 0; font-weight: bold;">MSME: [Aadhaar Redacted]</p>
                    </div>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 14px; color: #000; margin: 0; font-weight: bold;">Date: <span id="pdfDate"></span></p>
                    <p style="font-size: 14px; color: #000; margin: 5px 0 0 0; font-weight: bold;">Estimate: <span id="pdfEstNum"></span></p>
                </div>
            </div>
            <table style="width: 100%; border-collapse: collapse; margin-top: 5px; border: 1px solid #000;">
                <thead>
                    <tr style="background-color: #f3f4f6; color: #000; font-size: 14px; border-bottom: 2px solid #000;">
                        <th style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">Type</th>
                        <th style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">Description</th>
                        <th style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">Qty</th>
                        <th style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">Rate</th>
                        <th style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">Amount</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody" style="font-size: 14px; color: #000;"></tbody>
            </table>
            <div style="margin-top: 20px; text-align: right; font-size: 22px; font-weight: 900; color: #000;">
                <span style="border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 10px 0; display: inline-block;">
                    GRAND TOTAL: <span id="pdfGrandTotal">₹0</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        let inventory = [];
        try { inventory = JSON.parse(localStorage.getItem('rmp_inventory')) || []; } catch(e) { inventory = []; }
        let estimateList = [];

        function addToEstimate() {
            const itemId = document.getElementById('itemSelect').value;
            const qty = Number(document.getElementById('itemQty').value);
            if(!itemId || qty <= 0) return alert("Select an item and valid quantity");
            const item = inventory.find(i => i.id === itemId);
            
            let amount = 0, displayQty = '', displayRate = '';
            
            if(item.unit === 'Sheet (32 Sq.ft)') {
                amount = qty * 32 * item.sellPrice;
                displayQty = `${qty} Sheets (${qty * 32} Sq.ft)`;
                displayRate = `₹${item.sellPrice * 32}/Sheet`; 
            } else {
                amount = qty * item.sellPrice;
                let cleanUnit = item.unit.replace(/\(Direct\)/gi, '').trim();
                displayQty = `${qty} ${cleanUnit}`;
                displayRate = `₹${item.sellPrice}/${cleanUnit}`;
            }

            const descParts = [item.name, item.brand, item.grade, item.color, item.model].filter(Boolean).join(' · ');
            estimateList.push({ id: Date.now(), category: item.category, desc: descParts, qty: displayQty, rate: displayRate, amount: amount });
            renderEstimate();
        }

        function renderEstimate() {
            const pdfBody = document.getElementById('pdfTableBody');
            pdfBody.innerHTML = '';
            estimateList.forEach(row => {
                pdfBody.innerHTML += `
                    <tr>
                        <td style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: bold;">${row.category || '-'}</td>
                        <td style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">${row.desc}</td>
                        <td style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: bold;">${row.qty}</td>
                        <td style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: bold;">${row.rate}</td>
                        <td style="padding: 10px; text-align: center; border: 1px solid #000; font-weight: 900;">₹${row.amount}</td>
                    </tr>`;
            });
        }
        // ... (remaining functions like generatePDF and save remain same)
    </script>
</body>
</html>
